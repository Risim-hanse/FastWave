[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastwave"
version = "0.1.0"
description = "Official implementation of FastWave: Efficient waveform super-resolution based on Score-based Generative Models."
readme = "README.md"
requires-python = ">=3.9,<3.15"
license = { text = "MIT" }
keywords = ["audio", "super-resolution", "score-based", "generative-models", "waveform"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  # torch: cp313 wheels start at 2.6, cp314 at 2.9
  "torch>=2.2.0,<2.6; python_version < '3.13'",
  "torch>=2.6.0,<2.9; python_version == '3.13'",
  "torch>=2.9.0; python_version >= '3.14'",
  "torchvision>=0.17.0",
  # numpy: cp313+ needs numpy 2.x
  "numpy>=1.24.4,<2.0; python_version < '3.12'",
  "numpy>=2.1.0; python_version >= '3.12'",
  # scipy: cp312+ needs newer builds
  "scipy>=1.11.0,<2.0; python_version < '3.12'",
  "scipy>=1.14.0; python_version >= '3.12'",
  # pandas: cp312+ needs pandas 2.x+
  "pandas>=1.5.3,<3.0; python_version < '3.12'",
  "pandas>=2.0.0; python_version >= '3.12'",
  # audio
  "soundfile>=0.12.0",
  # config / logging
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "tqdm>=4.60",
  "matplotlib>=3.7",
  "wandb",
  "comet_ml",
]

[project.optional-dependencies]
dev = [
  "black",
  "isort",
  "pre-commit",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312", "py313", "py314"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]